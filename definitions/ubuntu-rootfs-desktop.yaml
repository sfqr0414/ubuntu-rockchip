name: ubuntu-rootfs
display-name: Ubuntu rootfs ARM64 (Desktop)
revision: 2
architecture: arm64
series: suite?
class: preinstalled
kernel: linux-generic
rootfs:
  archive: ubuntu
  components:
    - main
    - restricted
    - universe
    - multiverse
  mirror: "http://ports.ubuntu.com/ubuntu-ports"
  pocket: updates
  seed:
    urls:
      - "https://git.launchpad.net/~ubuntu-core-dev/ubuntu-seeds/+git/"
    branch: suite?
    names:
      - standard
customization:
  pocket: updates
  manual:
    copy-file:
      - source: tweaks.sh
        destination: /tweaks.sh
    execute:
      - path: /tweaks.sh
  extra-packages:
    - name: ubuntu-desktop
    - name: oem-config-gtk
    - name: oem-config
    - name: ubiquity-frontend-gtk
    - name: oem-config-slideshow-ubuntu
    - name: ubiquity-slideshow-ubuntu
    - name: squashfs-tools
    - name: systemd-growfs
    - name: snapd
  extra-snaps:
    - name: bare
    - name: core
    - name: core22
    - name: core24
# 提醒：如需自动生成镜像文件，请取消以下注释
# artifacts:
#   rootfs-tarball:
#     - name: ubuntu-rootfs-arm64.tar.xz
#       compression: xz
#   img:
#     - name: ubuntu-rootfs-arm64.img
#       volume: ubuntu

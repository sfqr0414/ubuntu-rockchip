name: ubuntu-rootfs
display-name: Ubuntu rootfs ARM64 (Desktop)
revision: 2
architecture: arm64
series: placeholder
class: preinstalled
kernel: linux-generic
rootfs:
  archive: ubuntu
  components:
    - main
    - restricted
    - universe
    - multiverse
  mirror: "http://ports.ubuntu.com/ubuntu-ports"
  pocket: updates
  seed:
    urls:
      - "https://git.launchpad.net/~ubuntu-core-dev/ubuntu-seeds/+git/"
    branch: placeholder
    names:
      - desktop-minimal
customization:
  cloud-init:
    user-data: |
      #cloud-config
      oem-config:
        enabled: true
  manual:
    copy-file:
      - source: tweaks.sh
        destination: /tweaks.sh
    execute:
      - path: /tweaks.sh
  extra-packages:
    - name: "u-boot-menu"
    - name: "initramfs-tools"
    - name: "ubuntu-desktop-minimal"
    - name: "oem-config-gtk"
    - name: "cloud-init"
    - name: "squashfs-tools"
  extra-snaps:
    - name: snapd
    - name: bare
    - name: core22
    - name: core24
#    - name: firefox
#    - name: gnome-42-2204
#    - name: gtk-common-themes
# 提醒：如需自动生成镜像文件，请取消以下注释

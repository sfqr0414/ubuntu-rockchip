name: ubuntu-rootfs
display-name: Ubuntu rootfs ARM64 (Server)
revision: 2
architecture: arm64
series: suite?
class: preinstalled
kernel: linux-generic
rootfs:
  archive: ubuntu
  components:
    - main
    - restricted
    - universe
    - multiverse
  mirror: "http://ports.ubuntu.com/ubuntu-ports"
  pocket: updates
  seed:
    urls:
      - "https://git.launchpad.net/~ubuntu-core-dev/ubuntu-seeds/+git/"
    branch: suite?
    names:
      - minimal
customization:
  pocket: updates
  manual:
    copy-file:
      - source: tweaks.sh
        destination: /tweaks.sh
    execute:
      - path: /tweaks.sh
  extra-packages:
    - name: initramfs-tools
    - name: squashfs-tools
    - name: snapd
  extra-snaps:
    - name: lxd
    - name: core
    - name: core22
    - name: core24
